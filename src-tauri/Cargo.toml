[package]
name = "xy-switch"
version = "1.2.0"
description = "Unified AI provider and extension manager"
authors = ["XY Switch Contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "xy_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The Tauri CLI resolves named crate features when collecting Linux bundle libraries.
linux-tray = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
zstd = "0.14.3"
unicode-general-category = { version = "1.1", path = "vendor/unicode-general-category" }
toml_edit = "0.25"
zeroize = "1"
ring = "0.17.14"
tauri-plugin-dialog = "2.7.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-xy-credentials = { path = "plugins/tauri-plugin-xy-credentials" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[patch.crates-io]
# Backport upstream VariantStrIter output-pointer fix for the GTK 0.18 chain.
glib = { path = "vendor/glib" }
