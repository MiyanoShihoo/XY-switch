name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      renderer_acceptance_only:
        description: 'Run isolated renderer UI acceptance only (no native packages or release)'
        type: boolean
        default: false
      native_acceptance_only:
        description: 'Run focused native acceptance against verified existing feature artifacts (no release)'
        type: boolean
        default: false
      native_source_run:
        description: 'Successful Build and verify run that produced the feature packages'
        type: string
        default: '41419299553'
      native_source_commit:
        description: 'Exact 40-character source commit; production inputs must still match'
        type: string
        default: 'fe4946bd2fcd4c27a7432aeadb5a656e0e6e676b'
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    if: ${{ !inputs.native_acceptance_only && !inputs.renderer_acceptance_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm build:renderer
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
  website:
    if: ${{ !inputs.renderer_acceptance_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install CJK fonts for real Chinese rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop website in a dedicated headless browser
        run: node scripts/verify-website-headless.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-website-ui
          path: artifacts/website-ui-qa/
          if-no-files-found: error
          retention-days: 14
  renderer-ui:
    if: ${{ !inputs.native_acceptance_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:ui:network
      - run: pnpm build:renderer
      - name: Install CJK fonts for real Chinese renderer acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify isolated renderer navigation and feature regressions
        run: pnpm test:ui:headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-renderer-ui
          path: |
            artifacts/workspace-headless-qa/
            !artifacts/workspace-headless-qa/browser-profile-*/**
          if-no-files-found: error
          retention-days: 14
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Linux system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev patchelf gnome-keyring dbus-x11 xvfb xdotool imagemagick
      - name: Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/debug
            src-tauri/target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows Credential Manager round trip
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked stores_reads_and_deletes_windows_credential -- --ignored --test-threads=1
      - name: Isolated Linux Secret Service round trip
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-keyring.sh
      - run: pnpm build:${{ matrix.platform }}
        env:
          XY_SWITCH_TOOLS_DIR: ${{ runner.temp }}/xy-switch-tools
      - name: Verify Windows installer, native window and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-bundles.ps1
      - name: Verify Linux dependencies and isolated package startup
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-bundles.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xy-switch-${{ matrix.platform }}-${{ runner.arch }}
          path: release/*/${{ matrix.platform }}-*/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Apple and Rust toolchains
        run: |
          xcodebuild -version
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-universal-rust-1.98.1-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Isolated native Apple Keychain round trip
        run: bash scripts/test-macos-keychain.sh
      - name: Build ARM64 and Intel universal bundles
        run: pnpm build:macos:universal
        env:
          XY_SWITCH_TOOLS_DIR: ${{ runner.temp }}/xy-switch-macos-tools
      - name: Verify app signature integrity, DMG and rendered window
        run: bash scripts/verify-macos-bundles.sh universal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xy-switch-macos-universal
          path: release/*/macos-universal/
          if-no-files-found: error
          retention-days: 14
  native-source:
    if: ${{ inputs.native_acceptance_only && !inputs.renderer_acceptance_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      windows_id: ${{ steps.source.outputs.windows_id }}
      windows_digest: ${{ steps.source.outputs.windows_digest }}
      linux_id: ${{ steps.source.outputs.linux_id }}
      linux_digest: ${{ steps.source.outputs.linux_digest }}
      macos_id: ${{ steps.source.outputs.macos_id }}
      macos_digest: ${{ steps.source.outputs.macos_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test three-platform native acceptance harness
        run: |
          node --test scripts/native-acceptance.test.mjs scripts/desktop-platforms.test.mjs
          python3 -B scripts/native-acceptance/unix_lifecycle_test.py
          bash -n scripts/native-acceptance/unix-lifecycle.sh
      - name: Bind source commit, production inputs and immutable artifact digests
        id: source
        run: node scripts/native-acceptance/artifact.mjs source artifacts/native-acceptance/source.json
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-source
          path: artifacts/native-acceptance/source.json
          if-no-files-found: error
          retention-days: 14

  native-windows-sync:
    needs: native-source
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
      NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact feature artifact and verify its GitHub SHA256
        shell: pwsh
        run: |
          node scripts/native-acceptance/artifact.mjs download "$env:RUNNER_TEMP/source-windows.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed' }
          node scripts/native-acceptance/extract-artifact.mjs "$env:RUNNER_TEMP/source-windows.zip" "$env:RUNNER_TEMP/source-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact extraction failed' }
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_ID: ${{ needs.native-source.outputs.windows_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ needs.native-source.outputs.windows_digest }}
      - name: Packaged native file picker, encryption, import and rollback
        shell: pwsh
        run: ./scripts/native-acceptance/windows.ps1 -ArtifactDirectory "$env:RUNNER_TEMP/source-windows" -OutputDirectory artifacts/native-acceptance/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-windows-sync
          path: artifacts/native-acceptance/windows/
          if-no-files-found: error
          retention-days: 14

  native-windows-lifecycle:
    needs: native-source
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
      NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify current and official previous installers
        shell: pwsh
        run: |
          node scripts/native-acceptance/artifact.mjs download "$env:RUNNER_TEMP/source-windows.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed' }
          node scripts/native-acceptance/extract-artifact.mjs "$env:RUNNER_TEMP/source-windows.zip" "$env:RUNNER_TEMP/source-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact extraction failed' }
          node scripts/native-acceptance/previous-release.mjs windows "$env:RUNNER_TEMP/previous-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Previous release verification failed' }
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_ID: ${{ needs.native-source.outputs.windows_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ needs.native-source.outputs.windows_digest }}
      - name: Real NSIS and MSI upgrade, native credentials, takeover and recovery
        shell: pwsh
        run: ./scripts/native-acceptance/windows-lifecycle.ps1 -ArtifactDirectory "$env:RUNNER_TEMP/source-windows" -PreviousDirectory "$env:RUNNER_TEMP/previous-windows" -OutputDirectory artifacts/native-acceptance/windows-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-windows-lifecycle
          path: artifacts/native-acceptance/windows-lifecycle/
          if-no-files-found: error
          retention-days: 14

  native-linux-lifecycle:
    needs: native-source
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
      NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native desktop verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libsecret-tools gnome-keyring dbus-x11 xvfb xdotool imagemagick tesseract-ocr fonts-noto-cjk
      - name: Download and verify current and official previous packages
        run: |
          node scripts/native-acceptance/artifact.mjs download "$RUNNER_TEMP/source-linux.zip"
          node scripts/native-acceptance/extract-artifact.mjs "$RUNNER_TEMP/source-linux.zip" "$RUNNER_TEMP/source-linux"
          node scripts/native-acceptance/previous-release.mjs linux "$RUNNER_TEMP/previous-linux"
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_ID: ${{ needs.native-source.outputs.linux_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ needs.native-source.outputs.linux_digest }}
      - name: Real Debian and AppImage upgrade, native GUI routing and recovery
        run: bash scripts/native-acceptance/unix-lifecycle.sh linux "$RUNNER_TEMP/source-linux" "$RUNNER_TEMP/previous-linux" artifacts/native-acceptance/linux-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-linux-lifecycle
          path: artifacts/native-acceptance/linux-lifecycle/
          if-no-files-found: error
          retention-days: 14

  native-macos-lifecycle:
    needs: native-source
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
      NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install screenshot text recognition
        run: command -v tesseract || brew install tesseract
      - name: Download and verify current and official previous bundles
        run: |
          node scripts/native-acceptance/artifact.mjs download "$RUNNER_TEMP/source-macos.zip"
          node scripts/native-acceptance/extract-artifact.mjs "$RUNNER_TEMP/source-macos.zip" "$RUNNER_TEMP/source-macos"
          node scripts/native-acceptance/previous-release.mjs macos "$RUNNER_TEMP/previous-macos"
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_ID: ${{ needs.native-source.outputs.macos_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ needs.native-source.outputs.macos_digest }}
      - name: Real DMG installation, upgrade, native GUI routing and recovery
        run: bash scripts/native-acceptance/unix-lifecycle.sh macos "$RUNNER_TEMP/source-macos" "$RUNNER_TEMP/previous-macos" artifacts/native-acceptance/macos-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-macos-lifecycle
          path: artifacts/native-acceptance/macos-lifecycle/
          if-no-files-found: error
          retention-days: 14
