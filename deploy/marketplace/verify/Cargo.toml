[package]
name = "xy-marketplace-verification"
version = "1.2.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "xy_switch_lib"
path = "lib.rs"

[[bin]]
name = "xy-marketplace"
path = "../../../src-tauri/src/bin/xy-marketplace.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "0.17.14"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
zeroize = "1"

[workspace]
